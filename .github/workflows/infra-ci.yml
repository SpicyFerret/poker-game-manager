name: Infra CI

on:
  workflow_dispatch:
    inputs:
      action:
        description: "tofu action to run on the self-hosted (Pi) runner"
        type: choice
        options:
          - plan
          - apply
        default: plan
      image_tag:
        description: "API image tag to deploy. Resolved to a digest before applying. Use sha-<short-sha> to roll back to a specific build."
        type: string
        default: latest
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"

defaults:
  run:
    working-directory: infra/kubernetes

jobs:
  fmt-and-validate:
    uses: ./.github/workflows/infra-fmt-validate.yml

  # Turns a tag into the digest it currently points at, so the Deployment is
  # pinned to exactly one image.
  #
  # This is what makes a deploy actually happen. Pinned to ':latest' the
  # Deployment spec never changed between builds, so Tofu saw no diff and
  # Kubernetes never recycled the pods — every release needed a manual
  # `kubectl rollout restart`, and twice that meant the API quietly kept serving
  # the previous build after an apply reported success.
  #
  # Runs on a GitHub-hosted runner rather than the Pi: it only needs the
  # registry, and the tooling is already there.
  resolve-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag to digest
        id: resolve
        working-directory: .
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          # github.repository keeps the owner's capitalisation, and GHCR image
          # names are lowercase. docker/metadata-action normalises this for us on
          # the publish side; imagetools does not, so do it here or every lookup
          # 404s on the capital letters.
          IMAGE="$(echo "ghcr.io/${GITHUB_REPOSITORY}-api" | tr '[:upper:]' '[:lower:]')"

          if ! digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "::error::No image found at $IMAGE:$TAG."
            echo "docker-publish.yml only builds when backend/src changes, so a commit that"
            echo "touched only the frontend or infra has no image of its own — deploy 'latest',"
            echo "or the sha-<short-sha> tag of the last backend build."
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$IMAGE:$TAG\` → \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  # plan/apply need to reach the k3s API server at 192.168.100.10:6443, a
  # private LAN address GitHub-hosted runners cannot route to. This job only
  # runs on the self-hosted runner registered on rb02 (see
  # infra/kubernetes/README.md for setup) and only on manual dispatch — never
  # automatically on push, since `apply` changes real infrastructure.
  plan-or-apply:
    if: github.event_name == 'workflow_dispatch'
    needs: [fmt-and-validate, resolve-image]
    runs-on: [self-hosted, linux, arm64, pi]
    env:
      # Picked up automatically by the S3-compatible backend (R2) — not
      # passed via -backend-config, those are the standard AWS SDK env vars.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # OpenTofu reads TF_VAR_<name> automatically for the matching input
      # variable — avoids ever interpolating a secret into a `run:` script
      # body (a `-var="...${{ secrets.X }}..."` string breaks if the value
      # contains a shell-special character; this doesn't).
      TF_VAR_kubeconfig_path: ./kubeconfig
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_image_digest: ${{ needs.resolve-image.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          # The Node.js-based wrapper needs `node` on PATH. GitHub-hosted
          # runners bundle it; this self-hosted one (bare Debian on rb02)
          # doesn't. Not needed for our use anyway.
          tofu_wrapper: false

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.PI_CLUSTER_KUBECONFIG }}
        # Defensive \r strip — harmless either way, doesn't hurt to keep.
        run: echo "$KUBECONFIG_CONTENT" | tr -d '\r' > kubeconfig

      - name: Write backend config
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "poker-game-manager-tfstate"
          endpoints = {
            s3 = "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          }
          EOF

      - name: init
        run: tofu init -backend-config=backend.hcl

      - name: plan
        run: tofu plan -out=tfplan

      - name: apply
        if: inputs.action == 'apply'
        run: tofu apply -auto-approve tfplan

      - name: Report what is running
        if: inputs.action == 'apply'
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          tofu output -raw deployed_image >> "$GITHUB_STEP_SUMMARY"
