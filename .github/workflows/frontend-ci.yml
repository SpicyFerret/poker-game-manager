name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck worker
        run: npm run typecheck:worker

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      - name: Check Cloudflare token
        id: cf-token
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Fill in wrangler.jsonc from repo variables
        if: steps.cf-token.outputs.present == 'true'
        run: |
          sed -i "s|__API_TUNNEL_HOSTNAME__|${{ vars.API_TUNNEL_HOSTNAME }}|" wrangler.jsonc
          sed -i "s|__FRONTEND_DOMAIN__|${{ vars.FRONTEND_DOMAIN }}|" wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        if: steps.cf-token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
