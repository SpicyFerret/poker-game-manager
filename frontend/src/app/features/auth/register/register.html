<div class="page">
  <mat-card>
    @if (submitting()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <mat-card-header>
      <mat-card-title i18n="@@register.heading">Criar conta</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field class="form-field-full">
          <mat-label i18n="@@field.firstName">Nome</mat-label>
          <input matInput formControlName="firstName" autocomplete="given-name" />
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label i18n="@@field.lastName">Sobrenome</mat-label>
          <input matInput formControlName="lastName" autocomplete="family-name" />
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label i18n="@@field.displayName">Apelido na mesa</mat-label>
          <input matInput formControlName="displayName" autocomplete="nickname" />
          <mat-hint i18n="@@register.displayNameHint"
            >Opcional — se ficar em branco usamos seu nome.</mat-hint
          >
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label i18n="@@field.email">E-mail</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label i18n="@@field.password">Senha</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-hint i18n="@@register.passwordHint">Mínimo de 8 caracteres.</mat-hint>
        </mat-form-field>

        @if (error(); as message) {
          <p role="alert">{{ message }}</p>
        }

        <button
          matButton="filled"
          type="submit"
          class="form-field-full"
          [disabled]="form.invalid || submitting()"
          i18n="@@register.submit"
        >
          Criar conta
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <a matButton routerLink="/login" i18n="@@register.toLogin">Já tenho conta</a>
    </mat-card-actions>
  </mat-card>
</div>
