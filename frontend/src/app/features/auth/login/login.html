<div class="page">
  <mat-card>
    @if (submitting()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <mat-card-header>
      <mat-card-title i18n="@@login.heading">Entrar</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field class="form-field-full">
          <mat-label i18n="@@field.email">E-mail</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label i18n="@@field.password">Senha</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        @if (error(); as message) {
          <p role="alert">{{ message }}</p>
        }

        <button
          matButton="filled"
          type="submit"
          class="form-field-full"
          [disabled]="form.invalid || submitting()"
          i18n="@@login.submit"
        >
          Entrar
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <a matButton routerLink="/register" i18n="@@login.toRegister">Ainda não tenho conta</a>
    </mat-card-actions>
  </mat-card>
</div>
