<div class="page">
  <mat-card>
    @if (submitting()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <mat-card-header>
      <mat-card-title i18n="@@join.heading">Entrar com código</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field class="form-field-full">
          <mat-label i18n="@@field.inviteCode">Código do convite</mat-label>
          <input matInput formControlName="code" autocapitalize="characters" autocomplete="off" />
          <mat-hint i18n="@@join.codeHint"
            >6 caracteres. Maiúsculas, espaços e traços não importam.</mat-hint
          >
        </mat-form-field>

        @if (error(); as message) {
          <p role="alert">{{ message }}</p>
        }

        <button
          matButton="filled"
          type="submit"
          class="form-field-full"
          [disabled]="form.invalid || submitting()"
          i18n="@@join.submit"
        >
          Entrar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
